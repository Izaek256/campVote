name: Bug report
description: Report a reproducible defect.
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment and versions
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs / screenshots
      description: Never include secrets, voter rosters, personal data, or ballot selections.
