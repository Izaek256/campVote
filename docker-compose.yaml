# CampVote compose — the Go API is the only thing containerised.
#
#   docker compose up -d            (add --build after changing backend code)
#
# Everything else already runs on this machine, and the API reaches it as itself:
#   postgres  EXTERNAL — .env's DATABASE_URL (127.0.0.1:5432 on this machine)
#   redis     external and optional; unset in .env behaves exactly as the host run does
#   mail      external and optional, otherwise the log driver
#   web       NOT here — run it on the host with `pnpm dev` on http://localhost:3000
#
# Configuration comes from .env alone. `env_file` passes every value through
# untouched, so the container reads exactly what `pnpm dev:api` reads: nothing is
# interpolated, reassembled or overridden here. That means .env must exist before
# `up`, and DATABASE_URL must point at a database that is already running.
#
# network_mode: host is what makes an untouched .env work. DATABASE_URL says
# localhost:5432, and on the default bridge network localhost is the container, so
# the API would hunt for Postgres inside its own empty network namespace. Sharing
# the host's namespace makes every localhost in .env mean the machine, as it
# already does when the API runs on the host. Consequences worth knowing:
#   * `ports:` is ignored — the API binds the host's :8080 directly, so nothing
#     else may hold that port, including `pnpm dev:api`.
#   * No published-port clash with a host database, and no host.docker.internal
#     (which on Linux would need extra_hosts: host-gateway plus a rewritten DSN).
#   * The container can reach every port on this machine. If that isolation
#     matters, drop network_mode, add extra_hosts, and give DATABASE_URL a
#     host.docker.internal host — then keep a second DSN for the host run.
#
# Migrations run from the image's entrypoint (apps/api/entrypoint.sh) before the
# server starts, against the external database, so there is no separate migrate
# step. If the database is not listening yet the entrypoint fails and restarts.
#
# First administrator, after `up`:
#   docker compose run --rm -e BOOTSTRAP_ADMIN_EMAIL=admin@must.ac.ug \
#     -e BOOTSTRAP_ADMIN_PASSWORD=yourpassword api ./bootstrap
#
# The container's only writable state is uploads and log-driver mail, kept in a
# named volume at /app/storage, where the config defaults put them
# (STORAGE_LOCAL_ROOT=storage/app, MAIL_LOG_PATH=storage/mail). Files uploaded by
# a host-run API live in apps/api/storage instead, and are not visible here.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: campvote-api:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - campvote_storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  campvote_storage:
